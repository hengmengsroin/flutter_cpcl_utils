name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify package
        uses: ./.github/actions/verify-package

  release:
    name: Tag unpublished version
    needs: verify
    if: github.repository == 'hengmengsroin/flutter_cpcl_utils' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release tag when the version is not on pub.dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bash tool/release_tag.sh create
